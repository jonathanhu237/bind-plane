name: bind-plane
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bind_plane
      POSTGRES_USER: bind_plane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bind_plane -d bind_plane"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
    restart: unless-stopped
  api:
    image: bind-plane-backend:latest
    build:
      context: .
      target: backend
    env_file: .env
    command: [sh, -c, "alembic upgrade head && exec uvicorn bind_plane.api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:28010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  worker:
    image: bind-plane-backend:latest
    env_file: .env
    command: [python, -m, bind_plane.worker.main]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: bind-plane-frontend:latest
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:25175:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
