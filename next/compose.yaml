name: bind-plane-next
services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-temvia}
      POSTGRES_USER: ${POSTGRES_USER:-temvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432
    volumes:
      - temvia-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      # A fresh PostgreSQL volume may spend over a minute in initialization.
      # Keep readiness real while allowing that bounded cold-start window.
      start_period: 90s
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.0
    profiles: [development]
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025

  migrate:
    build:
      context: ./api/migrations
      dockerfile: Dockerfile
    profiles: [tools]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-temvia}
      PGUSER: ${POSTGRES_USER:-temvia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGSSLMODE: ${POSTGRES_SSLMODE:-disable}
    command:
      - up

  api:
    stop_grace_period: ${SHUTDOWN_TIMEOUT:-30s}
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      HTTP_ADDR: ${HTTP_ADDR:-0.0.0.0:8080}
      SETUP_LINK_TTL: ${SETUP_LINK_TTL:-30m}
      PASSWORD_RESET_TOKEN_KEY: ${PASSWORD_RESET_TOKEN_KEY:?PASSWORD_RESET_TOKEN_KEY must be set in .env}
      BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY: ${BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY:?BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY must be set in .env}
      EMAIL_CHANGE_CODE_KEY: ${EMAIL_CHANGE_CODE_KEY:-}
      PASSWORD_RESET_LINK_TTL: ${PASSWORD_RESET_LINK_TTL:-30m}
      INVITATION_TOKEN_KEY: ${INVITATION_TOKEN_KEY:?INVITATION_TOKEN_KEY must be set in .env}
      INVITATION_LINK_TTL: ${INVITATION_LINK_TTL:-72h}
      EMAIL_SETTINGS_ENCRYPTION_KEY: ${EMAIL_SETTINGS_ENCRYPTION_KEY:?EMAIL_SETTINGS_ENCRYPTION_KEY must be set in .env}
      PASSWORD_RESET_MIN_RESPONSE_TIME: ${PASSWORD_RESET_MIN_RESPONSE_TIME:-500ms}
      PASSWORD_RESET_RATE_LIMIT_GLOBAL_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_GLOBAL_CAPACITY:-10}
      PASSWORD_RESET_RATE_LIMIT_GLOBAL_REFILL_INTERVAL: ${PASSWORD_RESET_RATE_LIMIT_GLOBAL_REFILL_INTERVAL:-6s}
      PASSWORD_RESET_RATE_LIMIT_EMAIL_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_EMAIL_CAPACITY:-3}
      PASSWORD_RESET_RATE_LIMIT_EMAIL_REFILL_INTERVAL: ${PASSWORD_RESET_RATE_LIMIT_EMAIL_REFILL_INTERVAL:-20m}
      SMTP_DELIVERY_TIMEOUT: ${SMTP_DELIVERY_TIMEOUT:-10s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      MAIL_DISPATCH_INTERVAL: ${MAIL_DISPATCH_INTERVAL:-1s}
      MAIL_OUTBOX_LEASE_TTL: ${MAIL_OUTBOX_LEASE_TTL:-30s}
      MAIL_RETRY_INITIAL_INTERVAL: ${MAIL_RETRY_INITIAL_INTERVAL:-5s}
      MAIL_RETRY_MAX_INTERVAL: ${MAIL_RETRY_MAX_INTERVAL:-10m}
      MAIL_NOTIFICATION_TTL: ${MAIL_NOTIFICATION_TTL:-24h}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-temvia}
      POSTGRES_USER: ${POSTGRES_USER:-temvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-0s}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-30m}
      SESSION_ABSOLUTE_TIMEOUT: ${SESSION_ABSOLUTE_TIMEOUT:-12h}
      PASSWORD_HASH_MAX_CONCURRENCY: ${PASSWORD_HASH_MAX_CONCURRENCY:-2}
      LOGIN_RATE_LIMIT_GLOBAL_CAPACITY: ${LOGIN_RATE_LIMIT_GLOBAL_CAPACITY:-60}
      LOGIN_RATE_LIMIT_GLOBAL_REFILL_INTERVAL: ${LOGIN_RATE_LIMIT_GLOBAL_REFILL_INTERVAL:-6s}
      LOGIN_RATE_LIMIT_EMAIL_CAPACITY: ${LOGIN_RATE_LIMIT_EMAIL_CAPACITY:-5}
      LOGIN_RATE_LIMIT_EMAIL_REFILL_INTERVAL: ${LOGIN_RATE_LIMIT_EMAIL_REFILL_INTERVAL:-1m}
      LOGIN_RATE_LIMIT_IP_CAPACITY: ${LOGIN_RATE_LIMIT_IP_CAPACITY:-30}
      LOGIN_RATE_LIMIT_IP_REFILL_INTERVAL: ${LOGIN_RATE_LIMIT_IP_REFILL_INTERVAL:-6s}
      SETUP_RATE_LIMIT_IP_CAPACITY: ${SETUP_RATE_LIMIT_IP_CAPACITY:-10}
      SETUP_RATE_LIMIT_IP_REFILL_INTERVAL: ${SETUP_RATE_LIMIT_IP_REFILL_INTERVAL:-1m}
      INVITATION_ACCEPT_RATE_LIMIT_IP_CAPACITY: ${INVITATION_ACCEPT_RATE_LIMIT_IP_CAPACITY:-30}
      INVITATION_ACCEPT_RATE_LIMIT_IP_REFILL_INTERVAL: ${INVITATION_ACCEPT_RATE_LIMIT_IP_REFILL_INTERVAL:-1m}
      PASSWORD_RESET_COMPLETE_RATE_LIMIT_IP_CAPACITY: ${PASSWORD_RESET_COMPLETE_RATE_LIMIT_IP_CAPACITY:-20}
      PASSWORD_RESET_COMPLETE_RATE_LIMIT_IP_REFILL_INTERVAL: ${PASSWORD_RESET_COMPLETE_RATE_LIMIT_IP_REFILL_INTERVAL:-1m}
      PASSWORD_RESET_RATE_LIMIT_IP_CAPACITY: ${PASSWORD_RESET_RATE_LIMIT_IP_CAPACITY:-30}
      PASSWORD_RESET_RATE_LIMIT_IP_REFILL_INTERVAL: ${PASSWORD_RESET_RATE_LIMIT_IP_REFILL_INTERVAL:-6s}
      INVITATION_RATE_LIMIT_ACTOR_CAPACITY: ${INVITATION_RATE_LIMIT_ACTOR_CAPACITY:-20}
      INVITATION_RATE_LIMIT_ACTOR_REFILL_INTERVAL: ${INVITATION_RATE_LIMIT_ACTOR_REFILL_INTERVAL:-1m}
      INVITATION_RATE_LIMIT_RECIPIENT_CAPACITY: ${INVITATION_RATE_LIMIT_RECIPIENT_CAPACITY:-3}
      INVITATION_RATE_LIMIT_RECIPIENT_REFILL_INTERVAL: ${INVITATION_RATE_LIMIT_RECIPIENT_REFILL_INTERVAL:-20m}
      TEST_EMAIL_RATE_LIMIT_GLOBAL_CAPACITY: ${TEST_EMAIL_RATE_LIMIT_GLOBAL_CAPACITY:-20}
      TEST_EMAIL_RATE_LIMIT_GLOBAL_REFILL_INTERVAL: ${TEST_EMAIL_RATE_LIMIT_GLOBAL_REFILL_INTERVAL:-1h}
      TEST_EMAIL_RATE_LIMIT_ACTOR_CAPACITY: ${TEST_EMAIL_RATE_LIMIT_ACTOR_CAPACITY:-5}
      TEST_EMAIL_RATE_LIMIT_ACTOR_REFILL_INTERVAL: ${TEST_EMAIL_RATE_LIMIT_ACTOR_REFILL_INTERVAL:-1h}
      TEST_EMAIL_RATE_LIMIT_RECIPIENT_CAPACITY: ${TEST_EMAIL_RATE_LIMIT_RECIPIENT_CAPACITY:-3}
      TEST_EMAIL_RATE_LIMIT_RECIPIENT_REFILL_INTERVAL: ${TEST_EMAIL_RATE_LIMIT_RECIPIENT_REFILL_INTERVAL:-20m}
      EMAIL_CHANGE_RATE_LIMIT_ACTOR_CAPACITY: ${EMAIL_CHANGE_RATE_LIMIT_ACTOR_CAPACITY:-5}
      EMAIL_CHANGE_RATE_LIMIT_ACTOR_REFILL_INTERVAL: ${EMAIL_CHANGE_RATE_LIMIT_ACTOR_REFILL_INTERVAL:-1h}
      EMAIL_CHANGE_RATE_LIMIT_RECIPIENT_CAPACITY: ${EMAIL_CHANGE_RATE_LIMIT_RECIPIENT_CAPACITY:-3}
      EMAIL_CHANGE_RATE_LIMIT_RECIPIENT_REFILL_INTERVAL: ${EMAIL_CHANGE_RATE_LIMIT_RECIPIENT_REFILL_INTERVAL:-20m}
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: next/worker/Dockerfile
    environment:
      EXECUTOR_DATABASE_URL: postgresql://${POSTGRES_USER:-temvia}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-temvia}
      BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY: ${BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY:?BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:${ADMIN_PORT:-5173}:8080
    depends_on:
      api:
        condition: service_started

volumes:
  temvia-postgres:
