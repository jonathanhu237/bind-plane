# Production stack for one host. Images are built on a build host and loaded here
# (see README.md); nothing is built or pulled from source on the server.
name: bind-plane

x-database: &database
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: bind_plane
  POSTGRES_USER: bind_plane
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_SSLMODE: disable

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: bind_plane
      POSTGRES_USER: bind_plane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bind_plane -d bind_plane]
      start_period: 90s
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [backend]

  migrate:
    image: bind-plane-migrate:${BIND_PLANE_TAG:?set BIND_PLANE_TAG in .env}
    profiles: [tools]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: bind_plane
      PGUSER: bind_plane
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGSSLMODE: disable
    command: [up]
    networks: [backend]

  api:
    image: bind-plane-api:${BIND_PLANE_TAG:?set BIND_PLANE_TAG in .env}
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database
      APP_ENV: production
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in .env}
      APP_ALLOW_PLAIN_HTTP: ${APP_ALLOW_PLAIN_HTTP:-false}
      HTTP_ADDR: 0.0.0.0:8080
      # Only the bundled Caddy may supply X-Forwarded-For.
      TRUSTED_PROXY_CIDRS: ${BIND_PLANE_SUBNET:-172.31.240.0/24}
      BIND_PLANE_TIMEZONE: ${BIND_PLANE_TIMEZONE:-Asia/Shanghai}
      PASSWORD_RESET_TOKEN_KEY: ${PASSWORD_RESET_TOKEN_KEY:?set PASSWORD_RESET_TOKEN_KEY in .env}
      INVITATION_TOKEN_KEY: ${INVITATION_TOKEN_KEY:?set INVITATION_TOKEN_KEY in .env}
      EMAIL_SETTINGS_ENCRYPTION_KEY: ${EMAIL_SETTINGS_ENCRYPTION_KEY:?set EMAIL_SETTINGS_ENCRYPTION_KEY in .env}
      BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY: ${BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY:?set BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY in .env}
    networks: [backend]

  worker:
    image: bind-plane-worker:${BIND_PLANE_TAG:?set BIND_PLANE_TAG in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EXECUTOR_DATABASE_URL: postgresql://bind_plane:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bind_plane
      BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY: ${BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY:?set BIND_PLANE_CREDENTIAL_ENCRYPTION_KEY in .env}
      BIND_PLANE_DEVICE_CONCURRENCY: ${BIND_PLANE_DEVICE_CONCURRENCY:-8}
    networks: [backend]

  admin:
    image: bind-plane-admin:${BIND_PLANE_TAG:?set BIND_PLANE_TAG in .env}
    restart: unless-stopped
    depends_on: [api]
    environment:
      BIND_PLANE_SITE: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in .env}
      BIND_PLANE_TLS_HOST: ${BIND_PLANE_TLS_HOST:?set BIND_PLANE_TLS_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - ${BIND_PLANE_LISTEN:-0.0.0.0}:${BIND_PLANE_PORT:-8443}:${BIND_PLANE_PORT:-8443}
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: ${BIND_PLANE_SUBNET:-172.31.240.0/24}

volumes:
  postgres:
  caddy-data: # Caddy's internal CA; keep it so the certificate stays the same
  caddy-config:
